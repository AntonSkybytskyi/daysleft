name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
  CLERK_SECRET_KEY: sk_test_0000000000000000000000000000000000000000
  CLERK_WEBHOOK_SECRET: whsec_0000000000000000000000000000
  DATABASE_URL: postgresql://localhost:5432/daysleft

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
